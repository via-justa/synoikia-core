# yaml-language-server: $schema=./node_modules/@synoikia/plugin-sdk/plugin-settings.schema.json
# {{name}}'s operations (or discover them in src/plugin.ts and keep only the rules).
# Reference: docs/plugin-authoring.md.

defaults:
  timeouts: { request: 15000, lookup: 10000 }

operations:
  - key: example.read
    group: example
    classification: read
    summary: An example read. Replace it with the upstream's operations.
  - key: example.delete
    group: example
    classification: write
    summary: An example destructive write.

rules:
  - match: example.delete
    locked: true
    confirm: { param: /name }
